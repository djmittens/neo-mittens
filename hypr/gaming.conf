# gaming.conf - Competitive low-latency gaming overrides
# Sourced from hyprland.conf
#
# Goal: minimize latency between mouse input and pixels-on-screen.
#
# REALITY CHECK (verified on Hyprland 0.56.0, RTX 5090, nvidia-open 610.43.03):
#
#   Direct scanout NOW WORKS. Verified live via `hyprctl monitors -j`:
#     solitary=<handle>  directScanoutTo=<handle>  directScanoutBlockedBy=None
#
#   Requirements, all three necessary:
#     1. render:direct_scanout = 1        (see render{} block below)
#     2. Game on a NORMAL workspace, not a special one.
#        A special workspace reports solitaryBlockedBy: ['SPECIAL','WORKSPACES'].
#     3. TRUE fullscreen (client `fullscreen` state 2), not maximize.
#        DP-2 reserves 42px on the right for a bar; a maximized window is
#        7638x2160 and leaves that strip composited, which kills scanout.
#        True fullscreen covers it -> 7680x2160.
#
#   Switching away drops scanout and returning re-engages it automatically.
#   There is NO modeset -- this is not X11 exclusive fullscreen. Cost of the
#   transition is ~1 frame (~4ms at 240Hz), i.e. irrelevant next to the
#   workspace-switch animation.
#
#   TEARING is a separate feature and is still NOT active. Remaining blockers
#   are ['NOT_TORN', 'HW_CURSOR']:
#     - HW_CURSOR: hardware cursors block tearing. But software cursors force
#       a full recomposite on every cursor move, which would break direct
#       scanout. You cannot have both; scanout is the bigger win, so the
#       hardware cursor stays and the `immediate yes` rules below remain
#       inert by design. They are kept only so gamescope/other titles can
#       use them.
#     - NOT_TORN: the client must submit tearing-eligible frames (in-game
#       vsync off). Overwatch currently does not.
#
#   Bigger latency wins still come from:
#     - CPU governor (gamemoderun wrapper around launches)
#     - Kernel cmdline (mitigations=off, etc.)
#     - Reflex working in OW (Vulkan VK_NV_low_latency2 confirmed present)

# ============================================================================
# Direct scanout: hand the game's buffer straight to the KMS plane, skipping
# compositing entirely. Matters a lot here -- DP-2 is 7680x2160@240, so a
# composite pass is ~33MP of bandwidth per frame.
# 0 = disable, 1 = enable, 2 = auto (only for content-type "game"; XWayland
# titles like OW may not set that, so 1 is used deliberately).
# ============================================================================
render {
    direct_scanout = 1
}

# ============================================================================
# Tearing: opt-in for the rare times Overwatch *is* fullscreen. Harmless
# in windowed mode (Hyprland just ignores `immediate yes` then).
# ============================================================================
general {
    allow_tearing = true
}

# ============================================================================
# Hardware cursor: ENABLED (no_hardware_cursors = false).
# Software cursor forces a full-output recomposite on every cursor move,
# which adds compositor load and frame-pacing jitter in windowed mode.
# Modern NVIDIA drivers support HW cursor under Wayland, so let the display
# engine draw the cursor and leave the compositor out of it.
# ============================================================================
cursor {
    no_hardware_cursors = false
}

# ============================================================================
# STEP 1: TAG WHAT COUNTS AS A GAME
#
# Everything below keys off `match:tag game`, so adding a new game is ONE line
# here -- you never touch the rule block. Tags are additive and evaluated at
# window-open time.
#
# To add a game, find its class/title with:  hyprctl clients
# ============================================================================

# Steam / Proton titles. Steam sets class to steam_app_<appid>; umu and
# GE-Proton fall back to steam_app_default (this is how Overwatch appears).
windowrule = tag +game, match:class ^(steam_app_.*)$

# Gamescope nested compositor (Steam games launched through it).
windowrule = tag +game, match:class ^(gamescope)$

# Native / non-Steam titles, matched by title or class.
windowrule = tag +game, match:title ^(Overwatch)$
windowrule = tag +game, match:class ^([Oo]verwatch.*)$

# --- EXCEPTIONS -------------------------------------------------------------
# Remove the tag from things that match above but shouldn't get the treatment.
# Rules are applied in order, so `-game` after `+game` wins.
#
# Cataclysm is deliberately NOT tagged: it's an ASCII roguelike, it gains
# nothing from a 7680x2160 scanout path, and the special:games overlay (Mod+B)
# suits it better. Its routing rule lives in hyprland.conf.
#
# Example of excepting something that WOULD otherwise match:
#   windowrule = tag -game, match:class ^(steam_app_.*)$, match:title ^(.*Launcher.*)$

# ============================================================================
# STEP 2: RULES FOR EVERYTHING TAGGED `game`
#
# Ordering note: workspace + fullscreen are what unlock direct scanout.
# The rest strip compositing overhead.
# ============================================================================

# --- Placement: normal workspace + TRUE fullscreen -> enables direct scanout
# A special workspace reports solitaryBlockedBy ['SPECIAL','WORKSPACES'], and
# a merely-maximized window leaves the 42px reserved bar composited. Both kill
# scanout. See the header for the full explanation.
#
# TRADEOFF: this means native resolution, no letterboxing. Letterboxing and
# scanout are mutually exclusive. To put a specific game back in the 21:9
# arena instead, except it from the tag and route it manually:
#   windowrule = workspace special:games silent, match:title ^(Foo)$
windowrule = workspace 3 silent, match:tag game
windowrule = fullscreen on, match:tag game

# --- Declare content type as "game".
# Lets the compositor/driver treat this as game content, and is the signal
# that misc:vrr=3 (fullscreen_game) and render:direct_scanout=2 (auto) key on.
windowrule = content game, match:tag game

# --- Strip compositing overhead.
# opaque: skip alpha blending. no_blur: skip the blur pass entirely (blur is
# size 4 / 1 pass globally, and is pure waste behind an opaque game).
windowrule = opaque on, match:tag game
windowrule = no_blur on, match:tag game
windowrule = no_anim on, match:tag game
windowrule = no_shadow on, match:tag game
windowrule = rounding 0, match:tag game
windowrule = border_size 0, match:tag game

# --- Tearing. Currently inert (blocked by HW_CURSOR + NOT_TORN), kept because
# it costs nothing and engages for gamescope, which manages its own cursor.
windowrule = immediate yes, match:tag game

# ============================================================================
# LAUNCHERS - not games, deliberately kept as a peek-and-dismiss overlay
# on special:games (Mod+B). Scanout is irrelevant for these.
# ============================================================================
windowrule = workspace special:games silent, match:class ^([Bb]attle\.net.*)$
windowrule = no_anim on, match:class ^([Bb]attle\.net.*)$
windowrule = no_shadow on, match:class ^([Bb]attle\.net.*)$
