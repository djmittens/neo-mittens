# hypridle config — refresh HDR/tone mapping after resume
# This repo is symlinked to ~/.config/hypr by bootstrap.sh

general {
  # lock_cmd = pidof hyprlock >/dev/null || hyprlock
  # before_sleep_cmd = loginctl lock-session
  # Run helper from PATH (bootstrap links it into ~/.local/bin)
  # Use safe mode + small delay to avoid DPMS race on resume
  after_sleep_cmd = hypr-hdr-refresh --safe --delay 2
  ignore_dbus_inhibit = false
}

# Blank displays when idle. This is the single biggest idle-power lever on this
# box: the G95NC's 7680x2160@240 pixel clock pins VRAM at 14001MHz / P0, so the
# 5090 draws ~74W with displays lit and ~12.5W with them off (measured).
listener {
  timeout = 600
  on-timeout = hyprctl dispatch dpms off
  # dpms on MUST come first and unconditionally: hypridle does not restore DPMS
  # itself, and hypr-hdr-refresh runs under `set -euo pipefail` — a hyprctl IPC
  # timeout on resume aborts it before its own dpms-on loop, leaving screens dark.
  on-resume = hyprctl dispatch dpms on; hypr-hdr-refresh --delay 2
}
