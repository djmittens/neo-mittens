# hypridle config
# This repo is symlinked to ~/.config/hypr by bootstrap.sh
#
# INERT — hypridle.service is MASKED. (2026-09-21)
# ------------------------------------------------
# Nothing in this file runs. The monitor is powered by hand, at its own button,
# and no daemon is allowed to blank it. swayidle, idlehack and wluma are masked
# too: all four ship vendor preset `enabled`, so a package upgrade would
# otherwise quietly start them again.
#
#   status:  systemctl --user list-unit-files | grep -E 'hypridle|swayidle|idlehack|wluma'
#   undo:    systemctl --user unmask hypridle.service
#
# `on-timeout` below is commented out as well, so that unmasking alone cannot
# silently restore 600s blanking. Everything else is left exactly as written,
# because the notes were expensive to learn.

general {
  # lock_cmd = pidof hyprlock >/dev/null || hyprlock
  # before_sleep_cmd = loginctl lock-session
  after_sleep_cmd = hyprctl dispatch dpms on
  ignore_dbus_inhibit = false
}

# Blank displays when idle. This is the single biggest idle-power lever on this
# box: the G95NC's 7680x2160@240 pixel clock pins VRAM at 14001MHz / P0, so the
# 5090 draws ~74W with displays lit and ~12.5W with them off (measured).
listener {
  timeout = 600
  # DISABLED 2026-09-21: no daemon may turn this monitor off. See header.
  # on-timeout = hyprctl dispatch dpms off

  # Free AI VRAM BEFORE the modeset, never after. dpms-on is the one moment the
  # desktop makes a large, sudden VRAM demand — it reallocates framebuffers for
  # 7680x2160@240 and retrains the DP link all at once. On 2026-09-16 that
  # landed while a 20-28GB model was resident, the compositor's channel missed
  # the driver's 7s Robust Channel deadline, and the GPU was declared locked:
  #
  #   krcWatchdog_IMPL: RC watchdog: GPU is probably locked! Notify Timeout Seconds: 7
  #   Xid (PCI:0000:01:00): 8, pid=1785, name=Hyprland, channel 0x00000002
  #
  # The Xid named Hyprland as the VICTIM, not the cause. The driver's remedy is
  # an engine reset, which left a phantom head — a disconnected connector with
  # zero EDID still marked `enabled`, holding the head so no mode would train on
  # the real one. That is unrecoverable from userspace and cost a reboot.
  #
  # `timeout 5` and `|| true` are load-bearing: this step must never be able to
  # keep dpms-on from running. Worst case it does nothing and we are exactly
  # where we were before.
  #
  # dpms on MUST come first and unconditionally: hypridle does not restore DPMS
  # itself, so anything that can abort before the dispatch leaves screens dark.
  #
  # NOTHING ELSE BELONGS ON THIS LINE. (2026-09-19)
  # ----------------------------------------------
  # This used to end in `; hypr-wake-verify`, a helper meant to catch the DP
  # link failing to retrain after a blank. It was the cause of the very problem
  # it was written to detect. It defaulted to WAKE_MON=DP-3, but the G95NC
  # enumerates as DP-2, so its health check could never pass — not once, ever.
  # Every single wake it fired four `hyprctl reload`s, i.e. four full modesets
  # at 7680x2160@240, spread over 85s while the panel was still re-acquiring:
  #
  #   19:12:44 DP-3 missing or wrong mode (attempt 1/4) — issuing hyprctl reload
  #   19:13:04 DP-3 missing or wrong mode (attempt 2/4) — issuing hyprctl reload
  #   19:13:24 DP-3 missing or wrong mode (attempt 3/4) — issuing hyprctl reload
  #   19:13:44 DP-3 missing or wrong mode (attempt 4/4) — issuing hyprctl reload
  #   19:14:04 WARNING: DP-3 still unhealthy after 4 attempts
  #
  # Its own comments had already predicted this: a reload issued while the panel
  # is still syncing aborts the acquisition and restarts it, "which looks
  # exactly like a link failure and turns one slow wake into a loop."
  #
  # The evidence it was built on was the same mistake. It claimed the connector
  # got "dropped from the compositor entirely: hyprctl monitors stops listing
  # DP-3 at all." But hyprland.conf:26 documents that the DP connector index
  # shifts around (DP-2 -> DP-5) after driver reloads and replugs. DP-3 stopped
  # being listed because it had been RENAMED, not dropped. That is why
  # hyprland.conf matches on `desc:` and not on a connector name.
  #
  # Symptoms that pointed at this rather than at the hardware: a manual dpms
  # off/on always recovered fine (no helper on that path), only hypridle's wake
  # broke, and `hyprctl dispatch exit` recovered it.
  #
  # So: no verification step, no reload, no wlr-randr. If a real retrain failure
  # ever does turn up, match the monitor by `desc:` like hyprland.conf does —
  # never by connector name.
  on-resume = timeout 5 deskmode release || true; hyprctl dispatch dpms on
}
