---
# gaming_kernel role
# Manages /etc/kernel/cmdline (systemd-boot) and /etc/modprobe.d/nvidia-perf.conf.
# Triggers initramfs regen via handler.

# ----------------------------------------------------------------------
# Detect bootloader -- systemd-boot vs GRUB. We support both, but the
# user said "switch to systemd-boot" for fresh installs. GRUB path is
# kept for migration scenarios.
# ----------------------------------------------------------------------
- name: Detect bootloader (systemd-boot)
  ansible.builtin.stat:
    path: /boot/loader/loader.conf
  register: sdboot_stat

- name: Detect bootloader (GRUB)
  ansible.builtin.stat:
    path: /etc/default/grub
  register: grub_stat

- name: Set bootloader fact
  ansible.builtin.set_fact:
    bootloader: >-
      {{
        'systemd-boot' if sdboot_stat.stat.exists
        else ('grub' if grub_stat.stat.exists else 'unknown')
      }}

- name: Show detected bootloader
  ansible.builtin.debug:
    msg: "Bootloader: {{ bootloader }}"

- name: Fail if no bootloader detected
  ansible.builtin.fail:
    msg: >
      Couldn't detect a supported bootloader. Expected /boot/loader/loader.conf
      (systemd-boot) or /etc/default/grub (GRUB). If you're using rEFInd or
      another bootloader, edit your kernel cmdline by hand to include:
      {{ kernel_cmdline_tokens | join(' ') }}
  when: bootloader == 'unknown'

# ----------------------------------------------------------------------
# Resume UUID lookup -- needed for the resume= cmdline token. Read from
# the active swap partition; if no swap, omit the resume= token entirely.
# ----------------------------------------------------------------------
- name: Find active swap source
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: swap_show
  changed_when: false
  failed_when: false

# zram (archinstall's default swap) has no UUID and can't hold a hibernate image
- name: Resolve resume UUID from swap source
  ansible.builtin.command: blkid -s UUID -o value {{ swap_partitions[0] }}
  vars:
    swap_partitions: "{{ swap_show.stdout_lines | reject('match', '^/dev/zram') | list }}"
  register: resume_uuid_lookup
  changed_when: false
  when: swap_show.stdout_lines | reject('match', '^/dev/zram') | list | length > 0

- name: Set resume_uuid fact
  ansible.builtin.set_fact:
    resume_uuid: "{{ resume_uuid_lookup.stdout | default('') }}"

- name: Show resume UUID
  ansible.builtin.debug:
    msg: "Resume UUID: {{ resume_uuid if resume_uuid else 'none (no swap; hibernate disabled)' }}"

# ----------------------------------------------------------------------
# Compose final cmdline by joining tokens + appending resume= if available.
# This expression is the single source of truth for the cmdline string.
# ----------------------------------------------------------------------
- name: Build effective kernel cmdline
  ansible.builtin.set_fact:
    effective_cmdline: >-
      {{
        kernel_cmdline_tokens | join(' ')
        + (' resume=UUID=' + resume_uuid if resume_uuid else '')
      }}

- name: Show effective cmdline
  ansible.builtin.debug:
    msg: "{{ effective_cmdline }}"

# ----------------------------------------------------------------------
# systemd-boot takes the whole cmdline from us (GRUB adds root= itself),
# so keep the boot-critical tokens the system is running with -- root=,
# rootflags=subvol=@, rw, ... -- and drop the ones this role manages.
# ----------------------------------------------------------------------
- name: Read running kernel cmdline
  ansible.builtin.command: cat /proc/cmdline
  register: proc_cmdline
  changed_when: false
  when: bootloader == 'systemd-boot'

- name: Build systemd-boot cmdline
  ansible.builtin.set_fact:
    sdboot_cmdline: >-
      {{
        (proc_cmdline.stdout.split()
          | reject('match', '^(BOOT_IMAGE|initrd)=')
          | reject('match', '^(' + (managed_keys | map('regex_escape') | join('|')) + ')(=|$)')
          | list
          + [effective_cmdline]) | join(' ')
      }}
  vars:
    managed_keys: "{{ kernel_cmdline_tokens | map('regex_replace', '=.*$', '') | list + ['resume'] }}"
  when: bootloader == 'systemd-boot'

- name: Show systemd-boot cmdline
  ansible.builtin.debug:
    msg: "{{ sdboot_cmdline }}"
  when: bootloader == 'systemd-boot'

# /etc/kernel/cmdline is only read when building unified kernel images;
# plain loader entries carry their own `options` line.
- name: Detect unified kernel images
  ansible.builtin.stat:
    path: /etc/kernel/cmdline
  register: kernel_cmdline_file
  when: bootloader == 'systemd-boot'

# ----------------------------------------------------------------------
# Apply cmdline based on bootloader.
# ----------------------------------------------------------------------
- name: Write /etc/kernel/cmdline (systemd-boot, UKI)
  ansible.builtin.copy:
    content: "{{ sdboot_cmdline }}\n"
    dest: /etc/kernel/cmdline
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  when: bootloader == 'systemd-boot' and kernel_cmdline_file.stat.exists
  notify: regenerate initramfs

- name: Find systemd-boot loader entries
  ansible.builtin.find:
    paths: /boot/loader/entries
    patterns: "*.conf"
  register: sdboot_entries
  become: true
  when: bootloader == 'systemd-boot' and not kernel_cmdline_file.stat.exists

- name: Write cmdline into loader entries (systemd-boot, no UKI)
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    regexp: '^options\s'
    line: "options {{ sdboot_cmdline }}"
    backup: true
  loop: "{{ sdboot_entries.files | default([]) }}"
  become: true
  when: bootloader == 'systemd-boot' and not kernel_cmdline_file.stat.exists

- name: Update GRUB_CMDLINE_LINUX_DEFAULT (GRUB)
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
    line: "GRUB_CMDLINE_LINUX_DEFAULT='{{ effective_cmdline }}'"
    backup: true
  become: true
  when: bootloader == 'grub'
  notify:
    - regenerate grub config
    - regenerate initramfs

# ----------------------------------------------------------------------
# NVIDIA modprobe options. Templated from the dict in group_vars so adding
# new options is a one-line change in YAML, not a file edit.
# ----------------------------------------------------------------------
- name: Render /etc/modprobe.d/nvidia-perf.conf
  ansible.builtin.template:
    src: nvidia-perf.conf.j2
    dest: /etc/modprobe.d/nvidia-perf.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  notify: regenerate initramfs
